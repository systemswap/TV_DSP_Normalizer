# TV-Dynamikprozessor - CamillaDSP-Pipeline (Kaltstartzustand), ab 2.0.0 Band-Zweig
#
# Signalweg:
#   Eingang -> Vorpegel -> Aux1 (Band-Leveler) -> 16-Band-EQ (Lautsprecherkorrektur)
#           -> Loudness-Kompensation (Parallelpfad, Aux3)
#           -> Sidechain (Mid, HP 120 Hz) + 30 ms Vorlauf auf den Nutzkanaelen
#           -> Decke (Kompressor: feste Ausgangsgrenze = Bandoberkante + 1 dB)
#           -> Limiter -2 dBFS
#
# WICHTIG: Diese Datei ist nur der Kaltstart. Im Betrieb setzt das Backend
# ueber die WebSocket-API EQ, Decken-Schwelle (aus der automatischen
# Kalibrierung), Vorlauf an/aus und den Loudness-Pfad an/aus (band_anwenden).
# Aux1 = Leveler-Gain, Aux3 = Anteil der Loudness-Kurve (Start -100 dB = aus,
# der Dienst startet mit --gain3=-100), Main = Hauptlautstaerke (--gain=-35).
# Konzept und Messungen: docs/band-konzept.md
---
devices:
  samplerate: 48000
  chunksize: 1024
  queuelimit: 4
  enable_rate_adjust: false
  silence_threshold: -80
  silence_timeout: 3.0
  capture:
    type: Alsa
    channels: 2
    device: "dsnoop_tv"
    format: S32_LE
  playback:
    type: Alsa
    channels: 2
    device: "hw:sndrpihifiberry,0"
    format: S32_LE

filters:
  # --- Eingang --------------------------------------------------------
  # Fester Vorpegel: Reserve fuer den Leveler nach oben.
  vorpegel:
    type: Gain
    parameters: { gain: -6.0, inverted: false, mute: false }

  # Band-Leveler: Aux1-Fader, 20 ms Rampe (ein Audio-Chunk bei 48 kHz/1024).
  agc:
    type: Volume
    parameters: { ramp_time: 20.0, fader: Aux1 }

  # --- Klangkurve (Lautsprecherkorrektur), Werte kommen aus settings.json --
  eq00: { type: Biquad, parameters: { type: Peaking, freq: 16,   bandwidth: 1.0, gain: 0.0 } }
  eq01: { type: Biquad, parameters: { type: Peaking, freq: 25,   bandwidth: 1.0, gain: 0.0 } }
  eq02: { type: Biquad, parameters: { type: Peaking, freq: 40,   bandwidth: 1.0, gain: 0.0 } }
  eq03: { type: Biquad, parameters: { type: Peaking, freq: 63,   bandwidth: 1.0, gain: 0.0 } }
  eq04: { type: Biquad, parameters: { type: Peaking, freq: 100,  bandwidth: 1.0, gain: 0.0 } }
  eq05: { type: Biquad, parameters: { type: Peaking, freq: 160,  bandwidth: 1.0, gain: 0.0 } }
  eq06: { type: Biquad, parameters: { type: Peaking, freq: 250,  bandwidth: 1.0, gain: 0.0 } }
  eq07: { type: Biquad, parameters: { type: Peaking, freq: 400,  bandwidth: 1.0, gain: 0.0 } }
  eq08: { type: Biquad, parameters: { type: Peaking, freq: 630,  bandwidth: 1.0, gain: 0.0 } }
  eq09: { type: Biquad, parameters: { type: Peaking, freq: 1000, bandwidth: 1.0, gain: 0.0 } }
  eq10: { type: Biquad, parameters: { type: Peaking, freq: 1600, bandwidth: 1.0, gain: 0.0 } }
  eq11: { type: Biquad, parameters: { type: Peaking, freq: 2500, bandwidth: 1.0, gain: 0.0 } }
  eq12: { type: Biquad, parameters: { type: Peaking, freq: 4000, bandwidth: 1.0, gain: 0.0 } }
  eq13: { type: Biquad, parameters: { type: Peaking, freq: 6300, bandwidth: 1.0, gain: 0.0 } }
  eq14: { type: Biquad, parameters: { type: Peaking, freq: 10000, bandwidth: 1.0, gain: 0.0 } }
  eq15: { type: Biquad, parameters: { type: Peaking, freq: 16000, bandwidth: 1.0, gain: 0.0 } }

  # --- Loudness-Kompensation: out = x + a*(H(x) - x), a = Aux3 ----------
  # H: Low-Shelf +6 dB @120 Hz, High-Shelf +2 dB @6 kHz, Trim -1,4 dB
  # (lautheitsneutral, offline gegen CamillaDSP 4.1.3 gemessen).
  band_ld_ls:   { type: Biquad, parameters: { type: Lowshelf,  freq: 120,  q: 0.7, gain: 6.0 } }
  band_ld_hs:   { type: Biquad, parameters: { type: Highshelf, freq: 6000, q: 0.7, gain: 2.0 } }
  band_ld_trim: { type: Gain, parameters: { gain: -1.4, inverted: false, mute: false } }
  band_ld_aux:  { type: Volume, parameters: { ramp_time: 200.0, fader: Aux3 } }

  # --- Sidechain der Decke: nur Rumpeln unter 50 Hz ausgeblendet ------------
  sc_hp:
    type: Biquad
    parameters: { type: Highpass, freq: 50, q: 0.7 }

  # --- Vorlauf: Nutzkanaele 30 ms hinter dem Sidechain -> Lookahead-Decke -
  band_vorlauf:
    type: Delay
    parameters: { delay: 30.0, unit: ms, subsample: false }

  # --- Ausgangsstufe -------------------------------------------------
  # Pegel des Nutzers: Aux2 HINTER der Decke (Main sitzt vor der Pipeline
  # und wuerde den Decken-Sidechain mit absenken). Dienst startet mit
  # --gain=-35 --gain2=-35; das Backend setzt Aux2 und gibt Main auf 0 frei.
  ausgang:
    type: Volume
    parameters: { ramp_time: 400.0, fader: Aux2 }
  limiter:
    type: Limiter
    parameters: { clip_limit: -2.0, soft_clip: false }

mixers:
  # 2 -> 7: 0,1 Nutz | 2 Sidechain (Mid) | 3,4 H(x)-Pfad | 5,6 x-Kopie
  band_expand:
    channels: { in: 2, out: 7 }
    mapping:
      - { dest: 0, sources: [ { channel: 0, gain: 0.0, inverted: false } ] }
      - { dest: 1, sources: [ { channel: 1, gain: 0.0, inverted: false } ] }
      - { dest: 2, sources: [ { channel: 0, gain: -6.0, inverted: false }, { channel: 1, gain: -6.0, inverted: false } ] }
      - { dest: 3, sources: [ { channel: 0, gain: 0.0, inverted: false } ] }
      - { dest: 4, sources: [ { channel: 1, gain: 0.0, inverted: false } ] }
      - { dest: 5, sources: [ { channel: 0, gain: 0.0, inverted: false } ] }
      - { dest: 6, sources: [ { channel: 1, gain: 0.0, inverted: false } ] }
  # 7 -> 3: Nutz = 0 + 3 - 5 (bzw. 1 + 4 - 6), Sidechain bleibt Kanal 2
  band_zusammen:
    channels: { in: 7, out: 3 }
    mapping:
      - { dest: 0, sources: [ { channel: 0, gain: 0.0, inverted: false }, { channel: 3, gain: 0.0, inverted: false }, { channel: 5, gain: 0.0, inverted: true } ] }
      - { dest: 1, sources: [ { channel: 1, gain: 0.0, inverted: false }, { channel: 4, gain: 0.0, inverted: false }, { channel: 6, gain: 0.0, inverted: true } ] }
      # Detektor der Decke aus den FERTIGEN Nutzkanaelen (Mitte, je -6 dB),
      # damit die Decke die Loudness-Kompensation mitsieht (2.8.0).
      - { dest: 2, sources: [ { channel: 0, gain: -6.0, inverted: false }, { channel: 3, gain: -6.0, inverted: false }, { channel: 5, gain: -6.0, inverted: true },
                              { channel: 1, gain: -6.0, inverted: false }, { channel: 4, gain: -6.0, inverted: false }, { channel: 6, gain: -6.0, inverted: true } ] }
  # 2 -> 3 ohne Loudness-Pfad (Kompensation aus)
  expand:
    channels: { in: 2, out: 3 }
    mapping:
      - { dest: 0, sources: [ { channel: 0, gain: 0.0, inverted: false } ] }
      - { dest: 1, sources: [ { channel: 1, gain: 0.0, inverted: false } ] }
      - { dest: 2, sources: [ { channel: 0, gain: -6.0, inverted: false }, { channel: 1, gain: -6.0, inverted: false } ] }
  # 3 -> 2: Sidechain entfernen
  collapse:
    channels: { in: 3, out: 2 }
    mapping:
      - { dest: 0, sources: [ { channel: 0, gain: 0.0, inverted: false } ] }
      - { dest: 1, sources: [ { channel: 1, gain: 0.0, inverted: false } ] }

processors:
  # Decke: sitzt HINTER Aux1, ihr Eingang enthaelt den Leveler-Gain -> die
  # Schwelle ist eine feste Ausgangsgrenze (Oberkante + 1 dB, vom Backend
  # ueber die Kalibrierung gesetzt). Makeup gleicht nur den Vorpegel aus.
  band_decke:
    type: Compressor
    description: "Band-Oberkante: feste Ausgangsgrenze hinter Aux1"
    parameters:
      channels: 3
      attack: 0.002
      release: 0.3
      threshold: -47.0
      factor: 20.0
      makeup_gain: 6.0
      clip_limit: null
      soft_clip: false
      monitor_channels: [2]
      process_channels: [0, 1]

pipeline:
  - { type: Filter, channels: [0, 1], names: [vorpegel, agc, eq00, eq01, eq02, eq03, eq04, eq05, eq06, eq07, eq08, eq09, eq10, eq11, eq12, eq13, eq14, eq15] }
  - { type: Mixer, name: band_expand }
  - { type: Filter, channels: [3, 4], names: [band_ld_ls, band_ld_hs, band_ld_trim] }
  - { type: Filter, channels: [3, 4, 5, 6], names: [band_ld_aux] }
  - { type: Mixer, name: band_zusammen }
  - { type: Filter, channels: [2], names: [sc_hp] }
  - { type: Filter, channels: [0, 1], names: [band_vorlauf] }
  - { type: Processor, name: band_decke }
  - { type: Mixer, name: collapse }
  - { type: Filter, channels: [0, 1], names: [ausgang, limiter] }
